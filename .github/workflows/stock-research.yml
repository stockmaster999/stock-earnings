name: Stock research

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: '미국 티커 (비우면 관심종목 목록)'
        required: false
        type: string
      ai_analysis:
        description: 'AI 분석 실행 (OPENAI_API_KEY 필요)'
        required: false
        type: boolean
        default: false
  schedule:
    # 월~금 22:00 UTC (한국 시간 화~토 07:00). 미국 정규장 마감 후.
    - cron: '0 22 * * 1-5'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect source data and optionally analyze
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REQUESTED_TICKER: ${{ inputs.ticker }}
          REQUESTED_AI: ${{ inputs.ai_analysis }}
          SCHEDULED_AI: ${{ vars.AI_ANALYSIS_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          args=()
          if [[ "$REQUESTED_AI" == "true" ]]; then args+=(--ai); fi
          if [[ "$EVENT_NAME" == "schedule" && "$SCHEDULED_AI" == "true" ]]; then args+=(--ai); fi
          if [[ -n "$REQUESTED_TICKER" ]]; then args+=("$REQUESTED_TICKER"); fi
          python -m stock_research "${args[@]}"
      - name: Upload reports even if a source failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-research-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
